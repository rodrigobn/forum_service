spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: ${DATABASE_URL} # Via variável de ambiente
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false # Desative em produção
        format_sql: false

  flyway:
    enabled: true
    repair: true
    locations: classpath:db/migration

  cache:
    type: redis
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.flywaydb: INFO

security:
  jwt:
    expiration: 86400000
    secret: "${JWT_SECRET}"
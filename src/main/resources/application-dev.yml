spring:
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver # Driver de conexão com o banco de dados MySQL
    url: jdbc:mysql://localhost:3306/forum # URL de conexão com o banco de dados MySQL chamado forum
    username: root
    password: root

  jpa:
    open-in-view: false # Evita o problema de LazyInitializationException
    properties:
      hibernate:
        show_sql: true # Mostra o SQL gerado pelo Hibernate no console do servidor de aplicação
        format_sql: true # Formata o SQL gerado pelo Hibernate no console do servidor de aplicação

  flyway:
    repair: true # Corrige a ordem das migrações caso haja alguma inconsistência no banco de dados

  # Configuração de cache e Redis para armazenamento de cache de dados da aplicação
  cache:
    type: redis # Habilita o uso do Redis como cache
  redis:
    host: localhost # Host do servidor Redis
    port: 6379 # Porta do servidor Redis

  # Configuração de envio de e-mail
  mail:
    host: sandbox.smtp.mailtrap.io # Host do servidor de e-mail
    port: 2525 # Porta do servidor de e-mail
    username: c4df735746d94f # Usuário do servidor de e-mail
    password: 8d7092a8e3f7bd # Senha do servidor de e-mail
    properties: # Propriedades do servidor de e-mail
      mail:
        transport:
          protocol: smtp # Protocolo de envio de e-mail
        debug: true # Habilita o log de envio de e-mail
        smtp:
          auth: true # Habilita a autenticação no servidor de e-mail
          starttls:
            enable: true # Habilita o uso do protocolo TLS

logging:
  level:
    org.springframework.security: DEBUG # Habilita o log de segurança do Spring Security
    org.hibernate.SQL: DEBUG # Habilita o log de SQL do Hibernate
    org.flywaydb: DEBUG # Habilita o log de migração do Flyway

security:
  jwt:
    expiration: 86400000 # 1 dia em milissegundos
    secret: "chaveSecreta"